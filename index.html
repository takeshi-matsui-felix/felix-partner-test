<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root{--navy:#16324F;--blue:#2C4F78;--amber:#E8A33D;--bg:#F3F5F8;--line:#D9DEE6;--red:#C0392B;--green:#2E9E64;--gray:#6B7482}

  .btn-sub{background:#fff;border:1px solid var(--line);color:var(--navy)}

  label.cam{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--amber);color:#2B2200;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
  label.cam input{display:none}
  .btns{display:flex;gap:10px}
  .btns label{flex:1}
  label.cam.lib{background:#27AE60;color:#fff}
  label.cam.shot{background:#2980B9;color:#fff}
  .row{margin-top:10px}
  select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);font-size:15px;margin:6px 0 10px;background:#fff}
  input[type=text]{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);font-size:15px;margin-bottom:12px}
  #lb{display:none;position:fixed;inset:0;background:#0a0f19ee;z-index:100;align-items:center;justify-content:center;padding:16px}
  #lb img{max-width:96vw;max-height:94vh;border-radius:8px}
  .w{font-size:13px;font-weight:700;color:var(--blue);margin:14px 0 8px}
  .sp{display:inline-block;width:14px;height:14px;border:2px solid #fff7;border-top-color:#fff;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>

<style>#nav{display:flex;gap:6px;overflow-x:auto;background:#0E2338;padding:8px 10px;position:sticky;top:50px;z-index:9}#nav a{flex:none;color:#cfd8e3;text-decoration:none;font-size:13px;padding:7px 12px;border-radius:16px;white-space:nowrap}#nav a.on{background:#E8A33D;color:#2B2200;font-weight:700}</style>

<script>
// ==== 設定（現行アプリと同じ接続先・公開用キー） ====
const SB_URL = "https://vzuzeymvyftmfuaxrvtb.supabase.co";
const SB_KEY = "sb_publishable_2y-rvfayu8BYs0oo-UOzGA_EQTBYLxm";
const H = {apikey: SB_KEY, Authorization: "Bearer " + SB_KEY};
const SHANAI = ["社内検査(設計)", "社内検査(建設)", "社内検査(マーケ)", "社内検査(不動産)"];
const AREA_KEY = "felix_partner_area";

const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

// ==== 通信 ====
async function sget(table, params){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {headers: H});
  if(!r.ok) throw new Error(`${table} 取得失敗 (${r.status})`);
  return r.json();
}
async function spatch(table, col, val, body){
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${col}=eq.${encodeURIComponent(val)}`, {
    method:"PATCH", headers:{...H,"Content-Type":"application/json","Prefer":"return=minimal"}, body: JSON.stringify(body)});
  if(!r.ok) throw new Error(`更新失敗 (${r.status})`);
}
async function upload(blob, name){
  const r = await fetch(`${SB_URL}/storage/v1/object/photos/${name}`, {
    method:"POST", headers:{...H,"Content-Type":"image/jpeg","Cache-Control":"public, max-age=31536000, immutable"}, body: blob});
  if(!r.ok) throw new Error(`写真アップロード失敗 (${r.status})`);
  return `${SB_URL}/storage/v1/object/public/photos/${name}`;
}

// ==== 画像リサイズ（長辺800px・画質0.6／サムネは長辺400px・画質0.5） ====
async function toBitmap(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){}
  }
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
}
function drawJpeg(bmp, maxSide, q){
  const w = bmp.width, h = bmp.height, k = Math.min(1, maxSide / Math.max(w,h));
  const c = document.createElement("canvas"); c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", q));
}
// 電子黒板の文字を折り返して描く（現行カメラと同じ：1文字ずつ幅を測って折り返し）
function wrapText(ctx, text, x, y, maxW, lh, maxLines){
  if(!text) return y;
  let line = "", n = 0; const chars = text.split("");
  for(let i = 0; i < chars.length; i++){
    const t = line + chars[i];
    if(ctx.measureText(t).width > maxW && i > 0){
      ctx.fillText(line, x, y); line = chars[i]; y += lh; n++;
      if(n >= maxLines) return y;
    } else line = t;
  }
  ctx.fillText(line, x, y); return y + lh;
}
// 写真を長辺800pxに縮小→右下に黒板を合成→JPEG化。サムネイルは合成後の写真から作る（現行と同じ）
async function makePhotoSet(file, board){
  const bmp = await toBitmap(file);
  const MAX = 800, k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(bmp, 0, 0, w, h);
  const bw = w * 0.40, bh = h * 0.32, sx = w - bw - 10, sy = h - bh - 10;
  ctx.fillStyle = "rgba(0, 40, 80, 0.9)"; ctx.fillRect(sx, sy, bw, bh);
  ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.strokeRect(sx + 5, sy + 5, bw - 10, bh - 10);
  ctx.fillStyle = "white";
  const fs = Math.floor(w * 0.022);
  ctx.font = fs + "px 'Yu Gothic Medium','Hiragino Kaku Gothic ProN',sans-serif";
  const ls = fs * 1.4, tx = sx + 10, dw = bw - 20;
  let ty = sy + fs + 12;
  ty = wrapText(ctx, board.propName, tx, ty, dw, ls, 2);
  ty = wrapText(ctx, board.inspType + "  " + board.inspDate, tx, ty, dw, ls, 2);
  ty = wrapText(ctx, board.locationText, tx, ty, dw, ls, 2);
  ctx.fillStyle = "#ffdddd";
  wrapText(ctx, board.issueDetail, tx, ty, dw, ls, 3);
  const full = await new Promise(res => c.toBlob(res, "image/jpeg", 0.6));
  const thumb = await drawJpeg(c, 400, 0.5);
  return {full, thumb};
}
const IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function todayStr(){ const d = new Date(); return d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0"); }

// ==== 画面の位置をURLに保持（再読み込みしても同じ画面に戻る） ====
function route(){
  const q = new URLSearchParams(location.hash.replace(/^#/, ""));
  return {p: q.get("p"), t: q.get("t")};
}
function go(p, t){
  const q = new URLSearchParams(); if(p && t){ q.set("p",p); q.set("t",t); }
  location.hash = q.toString();   // hashchangeで再描画
}
window.addEventListener("hashchange", render);

// ==== 画面 ====
let ROLE = null; try{ ROLE = JSON.parse(lsGet("felix_role")||"null"); }catch(e){}
if(!ROLE){ location.replace("home.html"); }
let AREA = (ROLE && ROLE.role==="partner") ? ROLE.area : lsGet(AREA_KEY);
let pending = {};   // record_id -> {full, thumb, url}（送信前の写真を画面内に保持）

$("#changeArea").onclick = () => { location.href = "home.html?m=1"; };
$("#lb").onclick = () => { $("#lb").style.display = "none"; };
document.addEventListener("click", e => {
  const im = e.target.closest && e.target.closest("[data-full]");
  if(im){ $("#lb img").src = im.dataset.full; $("#lb").style.display = "flex"; }
});

function showError(msg, retry){
  view.innerHTML = `<div class="err">${esc(msg)}</div><button class="btn btn-primary" id="retry">もう一度読み込む</button>`;
  $("#retry").onclick = retry;
}

async function render(){
  $("#ttl").textContent = "是正実施";
  if(!AREA){
    $("#changeArea").style.display = "none";
    view.innerHTML = `<h2 style="text-align:center;color:var(--navy)">エリアを選択</h2>
      <button class="btn btn-area" style="background:var(--blue)" data-a="東海エリア">🛠️ 協力業者（東海エリア）</button>
      <button class="btn btn-area" style="background:var(--amber);color:#2B2200" data-a="関東エリア">🛠️ 協力業者（関東エリア）</button>`;
    view.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { AREA = b.dataset.a; lsSet(AREA_KEY, AREA); render(); });
    return;
  }
  $("#changeArea").style.display = "";
  const {p, t} = route();
  view.innerHTML = `<div class="info">読み込み中…</div>`;
  try{
    if(p && t) await renderDetail(p, t); else await renderList();
  }catch(e){
    showError("通信に失敗しました。電波の良い場所でもう一度お試しください。（" + e.message + "）", render);
  }
}

async function loadTree(){
  const [recs, ins, props] = await Promise.all([
    sget("inspection_records", "select=inspection_id,progress_status"),
    sget("inspections", "select=*&is_deleted=eq.false"),
    sget("properties", "select=*&is_deleted=eq.false")
  ]);
  props.sort((a,b)=>{
    const ka = (a.handover_date||"").trim() ? [0,a.handover_date] : [1,"9999-12-31"];
    const kb = (b.handover_date||"").trim() ? [0,b.handover_date] : [1,"9999-12-31"];
    return ka[0]-kb[0] || (ka[1]<kb[1]?-1:ka[1]>kb[1]?1:0);
  });
  const areaOf = {}, hdate = {}; props.forEach(x => { areaOf[x.property_id]=x.area; hdate[x.property_id]=x.handover_date; });
  const insMap = {}; ins.forEach(i => insMap[i.inspection_id] = i);
  const tree = {};
  recs.forEach(r => {
    const i = insMap[r.inspection_id]; if(!i) return;
    if(areaOf[i.property_id] !== AREA) return;
    const pn = i.property_name || "不明", tn = i.inspection_type || "不明";
    tree[pn] ??= {prop_id:i.property_id, types:{}};
    const c = tree[pn].types[tn] ??= {total:0, done:0, unres:0, wait_fix:0};
    c.total++;
    if(r.progress_status === "完了") c.done++;
    else { c.unres++; if(r.progress_status === "是正待ち") c.wait_fix++; }
  });
  const order = props.map(x=>x.property_name).filter(n => tree[n]);
  Object.keys(tree).forEach(n => { if(!order.includes(n)) order.push(n); });
  return {tree, order, hdate, ins};
}

let q_search = "";
async function renderList(){
  lsDel("felix_partner_session");
  const {tree, order, hdate} = await loadTree();
  let html = `<div class="info ok">現在の表示エリア：【 ${esc(AREA)} 】</div>
    <input type="text" id="q" placeholder="物件名で検索（一部入力でも可）" value="${esc(q_search)}">`;
  let any = false;
  order.forEach(pn => {
    if(q_search && !pn.includes(q_search)) return;
    const node = tree[pn];
    const types = Object.keys(node.types).filter(tn => node.types[tn].wait_fix > 0).sort();
    if(!types.length) return;
    any = true;
    const h = hdate[node.prop_id] ? ` (引渡し: ${esc(hdate[node.prop_id])})` : " (引渡し未設定)";
    html += `<details class="card"><summary>${esc(pn)}${h}</summary><div class="inner">`;
    types.forEach(tn => {
      const c = node.types[tn];
      html += `<button class="type-btn" data-p="${esc(pn)}" data-t="${esc(tn)}">${esc(tn)}</button>
        <div class="badge">全 ${c.total} 件 [ 完了：${c.done}件 ／ 未完了：${c.unres}件 ] ※うち是正報告待ち ${c.wait_fix}件</div>`;
    });
    html += `</div></details>`;
  });
  if(!any) html += `<div class="info">該当する対応必要項目はありません。</div>`;
  view.innerHTML = html;
  const onq=e=>{ if(e.isComposing) return; const old=e.target; q_search=old.value; renderList().then(()=>{ const nq=$("#q"); if(nq&&nq!==old){ nq.replaceWith(old); old.oninput=onq; old.oncompositionend=onq; } old.focus(); old.setSelectionRange(old.value.length,old.value.length); }); };
  $("#q").oninput = onq; $("#q").oncompositionend=onq;   // 日本語の変換中は再描画しない
  view.querySelectorAll(".type-btn").forEach(b => b.onclick = () => go(b.dataset.p, b.dataset.t));
}

async function renderDetail(pn, tn){
  $("#ttl").textContent = pn;
  const {tree, ins} = await loadTree();
  if(!tree[pn] || !tree[pn].types[tn]){
    go();   // このエリアに無い物件・検査なら一覧へ
    return;
  }
  lsSet("felix_partner_session", JSON.stringify({prop: pn, type: tn, ts: Date.now()}));   // 12時間以内なら、ホームから自動で戻れる
  const ids = ins.filter(i => i.property_name === pn && i.inspection_type === tn).map(i => i.inspection_id);
  const recsAll = ids.length ? await sget("inspection_records", `inspection_id=in.(${ids.join(",")})`) : [];
  let recs = recsAll.filter(r => r.progress_status === "是正待ち");
  const total = recsAll.length, wait = recs.length;

  let html = `<button class="btn btn-sub" id="back">⬅ 戻る</button>
    <div class="info">進捗： 指摘総数 ${total}件 ／ 残り（是正報告待ち） ${wait}件</div>`;
  if(total > 0 && wait === 0){ html += `<div class="info ok">この検査の是正はすべて報告済みです。「⬅ 戻る」で一覧に戻れます。</div>`; lsDel("felix_partner_session"); }

  if(recs.length && SHANAI.includes(tn)){
    const fl = [...new Set(recs.map(r=>r.floor_level).filter(Boolean))].sort();
    html += `部屋（階層）で絞り込み<select id="ffloor"><option>すべて表示</option>${fl.map(f=>`<option>${esc(f)}</option>`).join("")}</select>`;
  }
  if(recs.length){
    const ws = [...new Set(recs.map(r=>r.work_type||"その他"))].sort();
    html += `🛠️ 担当工種で絞り込む<select id="fwork"><option>すべて表示</option>${ws.map(f=>`<option>${esc(f)}</option>`).join("")}</select>`;
  }
  html += `<div id="recs"></div>`;
  view.innerHTML = html;
  $("#back").onclick = () => go();

  const draw = () => {
    const ff = $("#ffloor")?.value, fw = $("#fwork")?.value;
    let list = recs;
    if(ff && ff !== "すべて表示") list = list.filter(r => r.floor_level === ff);
    if(fw && fw !== "すべて表示") list = list.filter(r => (r.work_type||"その他") === fw);
    const groups = {}; list.forEach(r => (groups[r.work_type||"その他"] ??= []).push(r));
    let h = "";
    Object.entries(groups).forEach(([w, rs]) => {
      h += `<div class="w">■ 工種: ${esc(w)}</div>`;
      rs.forEach(r => h += recHtml(r, tn));
    });
    $("#recs").innerHTML = h;
    bindRecs(list, pn, tn, recs, draw);
  };
  $("#ffloor")?.addEventListener("change", draw);
  $("#fwork")?.addEventListener("change", draw);
  draw();
}

function recHtml(r, tn){
  const floor = r.floor_level||"", area = r.area||"", detail = r.issue_detail||"";
  const head = (tn.startsWith("【検査機関】") || floor === "一式") ? "" : `【${floor} ${area}】`.trim();
  const title = head ? `${head} ${detail}` : `【指摘内容】 ${detail}`;
  const before = r.issue_photo_url
    ? `<img src="${esc(r.issue_photo_thumb_url||r.issue_photo_url)}" data-full="${esc(r.issue_photo_url)}" alt="指摘箇所">`
    : `<div class="nophoto">写真なし</div>`;
  const pv = pending[r.record_id];
  return `<div class="rec" data-id="${esc(r.record_id)}">
    <h3>${esc(title)}</h3>
    ${r.reject_reason ? `<div class="reject">否認理由: ${esc(r.reject_reason)}</div>` : ""}
    <div class="cols">
      <div><h4>【指摘箇所（Before）】</h4>${before}</div>
      <div><h4>【是正写真（After）】</h4>
        <div class="after">${pv ? `<img src="${pv.url}" alt="プレビュー">` : `<div class="nophoto">未撮影</div>`}</div>
      </div>
    </div>
    <div class="row btns">
      <label class="cam lib">📁 ライブラリ<input type="file" accept="image/*" data-cam="${esc(r.record_id)}"></label>
      ${IS_MOBILE ? `<label class="cam shot">📷 ${pv ? "撮り直す" : "カメラ起動"}<input type="file" accept="image/*" capture="environment" data-cam="${esc(r.record_id)}"></label>` : ""}
    </div>
    <div class="row"><button class="btn btn-primary" data-send="${esc(r.record_id)}">完了報告</button></div>
    <div class="msg"></div>
  </div>`;
}

function bindRecs(list, pn, tn, allRecs, redraw){
  document.querySelectorAll("[data-cam]").forEach(inp => inp.onchange = async e => {
    const id = inp.dataset.cam, f = e.target.files[0]; if(!f) return;
    const box = inp.closest(".rec"), msg = box.querySelector(".msg");
    msg.innerHTML = `<div class="info">写真を処理中…</div>`;
    try{
      const rec = allRecs.find(x => String(x.record_id) === id) || {};
      const detail = rec.issue_detail || "";
      const board = {
        propName: pn, inspType: tn, inspDate: todayStr(),
        locationText: `${rec.floor_level||""} ${rec.area||""} ${rec.work_type||""}`.trim(),
        issueDetail: detail.length > 80 ? detail.slice(0, 80) + "..." : detail
      };
      const set = await makePhotoSet(f, board);
      if(pending[id]) URL.revokeObjectURL(pending[id].url);
      pending[id] = {...set, url: URL.createObjectURL(set.full)};
      box.querySelector(".after").innerHTML = `<img src="${pending[id].url}" alt="プレビュー">`;
      msg.innerHTML = "";
    }catch(err){ msg.innerHTML = `<div class="err">写真を読み込めませんでした。もう一度お試しください。</div>`; }
  });
  document.querySelectorAll("[data-send]").forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.send, box = btn.closest(".rec"), msg = box.querySelector(".msg");
    const pv = pending[id];
    if(!pv){ msg.innerHTML = `<div class="err">写真が必要です</div>`; return; }
    btn.disabled = true; btn.innerHTML = `<span class="sp"></span>送信中…`;
    try{
      const base = (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(16).slice(2));
      const fullUrl = await upload(pv.full, `${base}.jpg`);
      let thumbUrl = fullUrl;
      try{ thumbUrl = await upload(pv.thumb, `${base}_thumb.jpg`); }catch(e){}
      await spatch("inspection_records", "record_id", id, {progress_status:"是正確認中", fix_photo_url: fullUrl, fix_photo_thumb_url: thumbUrl});
      URL.revokeObjectURL(pv.url); delete pending[id];
      const idx = allRecs.findIndex(r => String(r.record_id) === id); if(idx >= 0) allRecs.splice(idx, 1);
      render();   // 残件数も含めて最新に
    }catch(err){
      btn.disabled = false; btn.textContent = "完了報告";
      msg.innerHTML = `<div class="err">送信に失敗しました。写真は残っています。もう一度「完了報告」を押してください。（${esc(err.message)}）</div>`;
    }
  });
}

render();
</script>
</body>
</html>
